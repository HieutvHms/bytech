name: reintechnik
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.18.6 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_blue_plus: ^1.4.0
  rxdart: ^0.28.0
  provider: ^6.0.5
  percent_indicator: ^4.2.2
  nsd: ^3.0.0
  connectivity_plus: ^6.1.0
  flutter_launcher_icons: ^0.14.1
  shared_preferences: ^2.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/app_icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Helvetica
      fonts:
        - asset: assets/fonts/HelveticaNeue-Light.ttf
          weight: 400
        - asset: assets/fonts/helvetica-neue-medium.ttf
          weight: 600
        - asset: assets/fonts/Helvetica-Bold.ttf
          weight: 700
